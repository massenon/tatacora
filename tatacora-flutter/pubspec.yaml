name: tatacora_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  drift: ^2.34.3
  # ⚠ `dio` et `connectivity_plus` ont ete RETIRES le 14/09/2026 (decision du
  # Product Owner) : `core/network/` et `core/sync/` n'existent plus. Depuis le
  # lot F2a (15/10/2026) le poste se synchronise en tache de fond par `http`
  # (voir plus bas) ; ne remettez ni `dio` ni `connectivity_plus`.
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0
  workmanager: ^0.10.7
  flutter_local_notifications: ^22.3.0
  lucide_icons: ^0.257.0
  path_provider: ^2.1.6
  decimal: ^3.2.6
  uuid: ^4.6.0
  path: ^1.9.1
  # Hachage du verificateur de connexion hors ligne. Aucun mot de passe
  # n est stocke : seul un derive PBKDF2 sale l est (voir
  # features/auth/data/verificateur_hors_ligne.dart).
  crypto: ^3.0.6
  printing: ^5.15.0
  pdf: ^3.13.0
  # Reduction d'un recu en image trop lourd (PO, 28/10/2026) : decodage et
  # JPEG en Dart pur. DEJA dans l'arbre (tire par `pdf`), seulement declare
  # direct : aucune nouvelle dependance, aucun code natif.
  image: ^4.9.2
  # Classeur .xlsx des modeles d'import (PO, 30/10/2026) : un .xlsx est une
  # archive ZIP de fichiers XML, ecrit et relu en Dart pur avec ces deux
  # paquets. DEJA dans l'arbre (tires par `image`/`pdf`/`flutter_local_
  # notifications`), seulement declares directs : aucune nouvelle dependance,
  # aucun code natif. Le paquet `excel`, absent de l'arbre, aurait ajoute une dependance.
  archive: ^4.0.9
  xml: ^7.0.1
  # Trace des graphiques du tableau de bord (PA-121). Retenue pour trois
  # raisons verifiees le 25/08/2026 : licence MIT, Windows supporte, et
  # AUCUNE dependance native (equatable + vector_math seulement) — le poste
  # du Gite ne doit rien avoir a installer. Syncfusion a ete ecartee : sa
  # licence communautaire exige moins de 1 M$ de CA ET moins de 5
  # developpeurs, une conformite a porter contractuellement.
  fl_chart: ^1.2.0
  # Selecteurs de fichier NATIFS de Windows (ouvrir / enregistrer sous) — demande
  # du PO du 14/10/2026 : l'import d'articles lit un CSV choisi par
  # l'utilisateur, le « Modele » s'enregistre ou il le decide. Implementation
  # Windows du plugin officiel `file_selector` (flutter.dev), prise directement :
  # la cible est le bureau seul (decision du PO du 08/10/2026). Aucun reseau.
  file_selector_windows: ^0.9.3+5
  file_selector_platform_interface: ^2.7.0
  # SMTP vers l'editeur — directive du PO du 14/10/2026 (Lot J2, partie 2) :
  # « Contactez l'editeur » ENVOIE reellement
  # (features/transverse/data/envoi_messages_editeur.dart) ; ce paquet ne
  # sert a rien d'autre. Pur Dart (dart:io), aucune dependance native. Le mot
  # de passe SMTP n'est jamais dans le code ni en base : il est relu a l'envoi
  # dans %APPDATA%/TATACORA/poste.json (voir README_DEPLOY.md).
  mailer: ^7.2.0
  # Synchronisation en tache de fond (lot F2a, 15/10/2026) : appairage du
  # poste (POST /login) et envoi de la file (POST /sync). `http` plutot que
  # `dio` : pur Dart, deja present en dependance TRANSITIVE (meme version, aucun
  # nouveau code telecharge), un seul `Client` a injecter — `MockClient` du
  # paquet sert de transport d'essai —, et rien de ce que `dio` ajoute
  # (intercepteurs, annulation, FormData) n'est utilise : le moteur lit le
  # statut de chaque reponse lui-meme. Seul consommateur :
  # features/synchronisation/data/transport_synchronisation.dart.
  http: ^1.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  sqlite3: ^3.5.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Le logo de l'etablissement : le PNG du Product Owner depuis le 14/10/2026
  # (D392, PA-210), octet pour octet celui de la vue
  # (`tatacora-api/public/assets/img/logo.png`) ; il remplace `logo.jpg`, qui
  # n'est plus embarque (le fichier reste sur le disque, suppression laissee
  # au lead). Chemin unique dans le code : `AppAssets.logo`. Il est EMBARQUE,
  # jamais telecharge : le poste du Gite encaisse hors connexion.
  assets:
    - assets/img/logo.png
    # La photo de couverture de l'ecran de connexion, colonne gauche du maitre
    # (`prototype_v2/pages/login.html` l.15). Embarquee pour la meme raison que
    # le logo : la connexion doit s'afficher entiere hors reseau.
    - assets/img/gite-cover.jpg

    # Le plan comptable du Product Owner (SYSCOHADA revise, 1 332 comptes), COPIE
    # OCTET POUR OCTET du fichier du serveur
    # (`tatacora-api/database/data/plan-comptable-syscohada-revise.csv`). Il est
    # charge dans `plan_comptable_local` par UNE fonction, a l'installation du
    # referentiel (idempotent) ; un test exige l'egalite des deux fichiers.
    - assets/data/plan-comptable-syscohada-revise.csv

    # La carte du Gite Chez Noel (affiches du 30/10/2026) deja mise aux colonnes
    # des modeles d'import : COPIE OCTET POUR OCTET de
    # `docs/data/modele_import_<module>.xlsx` (un test exige l'egalite).
    # Proposee par Import & Export comme « Carte du Gite Chez Noel (exemple) ».
    - assets/import/modele_import_m6-stocks.xlsx
    - assets/import/modele_import_m5-bar.xlsx
    - assets/import/modele_import_m4-restaurant.xlsx

  # La police Inter — celle que la PWA sert (`public/assets/fonts/Inter-*.woff2`)
  # et que `AppTextStyles.police` nomme. Elle était NOMMÉE sans être LIVRÉE
  # (Phase 1D de `docs/AUDIT_FIDELITE_FLUTTER_BLADE_2026-10-08.md`) : au poste,
  # le système retombait sur sa police par défaut, dont les largeurs de texte
  # ne sont pas celles de la vue. Un seul fichier VARIABLE (axe `wght`
  # 100-900, converti des woff2 de la PWA), déclaré aux quatre graisses que le
  # code emploie. Licence : SIL Open Font License 1.1 (Inter, The Inter Project
  # Authors) ; elle autorise l'embarquement.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
